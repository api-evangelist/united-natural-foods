naftiko: 1.0.0-alpha2
info:
  label: UNFI Supplier and Data API — Orders
  description: 'UNFI Supplier and Data API — Orders. 3 operations. Lead operation: List Orders. Self-contained Naftiko capability
    covering one United Natural Foods business surface.'
  tags:
  - United Natural Foods
  - Orders
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    UNITED_NATURAL_FOODS_API_KEY: UNITED_NATURAL_FOODS_API_KEY
capability:
  consumes:
  - type: http
    namespace: unfi-supplier-orders
    baseUri: https://api.unfi.com/v1
    description: UNFI Supplier and Data API — Orders business capability. Self-contained, no shared references.
    resources:
    - name: orders
      path: /orders
      operations:
      - name: listorders
        method: GET
        description: List Orders
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by order status
        - name: startDate
          in: query
          type: string
          description: Start date filter
        - name: endDate
          in: query
          type: string
          description: End date filter
        - name: warehouseId
          in: query
          type: string
          description: Filter by UNFI warehouse
    - name: orders-orderId
      path: /orders/{orderId}
      operations:
      - name: getorder
        method: GET
        description: Get Order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: orderId
          in: path
          type: string
          description: Purchase order identifier
          required: true
    - name: orders-orderId-fulfillment
      path: /orders/{orderId}/fulfillment
      operations:
      - name: submitfulfillment
        method: POST
        description: Submit Order Fulfillment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: orderId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: X-API-Key
      value: '{{env.UNITED_NATURAL_FOODS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: unfi-supplier-orders-rest
    port: 8080
    description: REST adapter for UNFI Supplier and Data API — Orders. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/orders
      name: orders
      description: REST surface for orders.
      operations:
      - method: GET
        name: listorders
        description: List Orders
        call: unfi-supplier-orders.listorders
        with:
          status: rest.status
          startDate: rest.startDate
          endDate: rest.endDate
          warehouseId: rest.warehouseId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/orders/{orderid}
      name: orders-orderid
      description: REST surface for orders-orderId.
      operations:
      - method: GET
        name: getorder
        description: Get Order
        call: unfi-supplier-orders.getorder
        with:
          orderId: rest.orderId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/orders/{orderid}/fulfillment
      name: orders-orderid-fulfillment
      description: REST surface for orders-orderId-fulfillment.
      operations:
      - method: POST
        name: submitfulfillment
        description: Submit Order Fulfillment
        call: unfi-supplier-orders.submitfulfillment
        with:
          orderId: rest.orderId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: unfi-supplier-orders-mcp
    port: 9090
    transport: http
    description: MCP adapter for UNFI Supplier and Data API — Orders. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-orders
      description: List Orders
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: unfi-supplier-orders.listorders
      with:
        status: tools.status
        startDate: tools.startDate
        endDate: tools.endDate
        warehouseId: tools.warehouseId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-order
      description: Get Order
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: unfi-supplier-orders.getorder
      with:
        orderId: tools.orderId
      outputParameters:
      - type: object
        mapping: $.
    - name: submit-order-fulfillment
      description: Submit Order Fulfillment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: unfi-supplier-orders.submitfulfillment
      with:
        orderId: tools.orderId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
